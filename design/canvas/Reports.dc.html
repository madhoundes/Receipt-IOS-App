<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tax Reports</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0B7A55}a:hover{color:#08603F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #111113; -webkit-font-smoothing: antialiased">
<div style="padding: 59px 16px 120px; display: flex; flex-direction: column; gap: 14px">

<h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.4px">Tax Year 2026</h1>

<div style="height: 32px; border-radius: 9px; background: rgba(118,118,128,0.12); padding: 2px; box-sizing: border-box; display: flex">
<span style="flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px">Month</span>
<span style="flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px">Quarter</span>
<span style="flex: 1; border-radius: 7px; background: #FFFFFF; box-shadow: 0 3px 8px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">Year</span>
</div>

<div style="background: #FFFFFF; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.4px; color: #6C6C70">TOTAL HST PAID</span>
<span style="font-size: 36px; line-height: 42px; font-weight: 700; color: #B35C00; font-variant-numeric: tabular-nums">$1,962.48</span>
<span style="font-size: 15px; color: #6C6C70">$18,406.12 spent · 284 receipts</span>
</div>
<span style="padding: 4px 8px; border-radius: 8px; background: #E4F3EC; color: #0B7A55; font-size: 12px; font-weight: 700">JAN to SEP</span>
</div>
<div style="display: flex; align-items: flex-end; gap: 8px; height: 92px">
<sc-for list="{{months}}" as="m" hint-placeholder-count="12">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="width: 100%; height: {{m.h}}px; border-radius: 5px; background: {{m.fill}}"></div>
<span style="font-size: 11px; font-weight: 500; color: #6C6C70">{{m.l}}</span>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #6C6C70; padding: 0 16px">HST BY CATEGORY</span>
<div style="background: #FFFFFF; border-radius: 14px; padding: 6px 16px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 5px; padding: 7px 0">
<div style="display: flex; justify-content: space-between; font-size: 15px"><span style="display: flex; align-items: center; gap: 8px; font-weight: 500"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{c.color}}"></span>{{c.name}}</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">{{c.v}}</span></div>
<div style="height: 6px; border-radius: 3px; background: #F0F0F3"><div style="height: 6px; border-radius: 3px; width: {{c.pct}}%; background: {{c.color}}"></div></div>
</div>
</sc-for>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; align-items: center; gap: 14px">
<span style="width: 44px; height: 44px; border-radius: 12px; background: #E4F3EC; color: #0B7A55; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5h17v12h-17z M9 7.5V5h6v2.5 M3.5 12.5h17"></path></svg></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 600">Send to Accountant</span><span style="font-size: 13px; color: #6C6C70">PDF summary + CSV with receipt images</span></div>
<a href="Export.dc.html" style="height: 34px; padding: 0 14px; border-radius: 17px; background: #0B7A55; color: #FFFFFF; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none">Export</a>
</div>
</div>

<nav aria-label="Tabs" style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; gap: 10px; align-items: center"><div style="flex-grow: 1; height: 62px; border-radius: 31px; background: rgba(255,255,255,0.78); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid rgba(0,0,0,0.08); box-shadow: 0 8px 24px rgba(0,0,0,0.12); display: flex; align-items: center; padding: 4px; box-sizing: border-box"><a href="Home.dc.html" style="flex: 1; height: 54px; color: #111113; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6H9v6H4a.5.5 0 0 1-.5-.5z"></path></svg><span style="font-size: 10px; font-weight: 500">Home</span></a><a href="History.dc.html" style="flex: 1; height: 54px; color: #111113; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5h12v19l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5z M9 7.5h6 M9 11h6 M9 14.5h3.5"></path></svg><span style="font-size: 10px; font-weight: 500">Receipts</span></a><a href="CategoriesTab.dc.html" style="flex: 1; height: 54px; color: #111113; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"></path></svg><span style="font-size: 10px; font-weight: 500">Categories</span></a><a href="Reports.dc.html" aria-current="page" style="flex: 1; height: 54px; border-radius: 27px; background: rgba(11,122,85,0.12); color: #0B7A55; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5 5 19 M7 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 1 0 0-5z M17 14.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 1 0 0-5z"></path></svg><span style="font-size: 10px; font-weight: 600">HST</span></a></div><a href="Scan.dc.html" aria-label="Scan a receipt" style="width: 62px; height: 62px; border-radius: 31px; background: #0B7A55; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 8px 20px rgba(11,122,85,0.35)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8V5A1.5 1.5 0 0 1 5 3.5h3 M16 3.5h3A1.5 1.5 0 0 1 20.5 5v3 M20.5 16v3a1.5 1.5 0 0 1-1.5 1.5h-3 M8 20.5H5A1.5 1.5 0 0 1 3.5 19v-3 M8 9h8 M8 12h8 M8 15h5"></path></svg></a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const vals = [180, 150, 240, 210, 260, 230, 250, 257, 184, 0, 0, 0];
    const labels = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
    const months = vals.map((v, i) => ({
      l: labels[i],
      h: v ? Math.round(v / 260 * 66) : 4,
      fill: i === 8 ? '#0B7A55' : (v ? '#A8D8C3' : '#EBEBEF')
    }));
    const cats = [
      { name: 'Gas', v: '$612.40', n: 612.40, color: '#B04A08' },
      { name: 'Digital Services', v: '$438.15', n: 438.15, color: '#0A5BC4' },
      { name: 'Office', v: '$377.02', n: 377.02, color: '#0B6E77' },
      { name: 'Dining', v: '$301.66', n: 301.66, color: '#B8185A' },
      { name: 'Grocery', v: '$148.25', n: 148.25, color: '#1E7A35' },
      { name: 'Transport', v: '$85.00', n: 85.00, color: '#5A3CC2' }
    ].map((c) => Object.assign(c, { pct: Math.round(c.n / 612.40 * 100) }));
    return { months, cats };
  }
}
</script>
</body>
</html>
