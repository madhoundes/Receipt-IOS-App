<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pts = ['0,0', '214,0'];
    for (let x = 214; x >= 0; x -= 10.7) pts.push(x.toFixed(1) + ',' + (Math.round(x / 10.7) % 2 ? 8 : 0));

    return { zig: pts.join(' ') };

}
